[package]
name = "solana-stealth-shield"
version = "0.1.0"
description = "Zero-Knowledge Stealth Addresses & Confidential Transfer Routing on Solana"
license = "MIT"
edition = "2021"

[lib]
name = "solana_stealth_shield"
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
solana-program = "1.18"
curve25519-dalek = { version = "4.1.3", features = ["precomputed-tables"] }
sha2 = "0.10.8"
blake3 = "=1.7.0"
zeroize_derive = "=1.4.2"
indexmap = "=2.7.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1